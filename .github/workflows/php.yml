name: PHP Composer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it replaces. Runs on main are
# never cancelled: the deploy looks up the result for the exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # runs alongside the test job instead of before it
  phpstan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl
          coverage: none

      - name: Install dependencies
        run: composer install --quiet --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Output the phpstan config
        run: more phpstan.neon.dist

      - name: Run php stan static analysis
        # Larastan boots the app, and AuthServiceProvider reads the permissions table;
        # an empty in-memory SQLite database stands in for MySQL here
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer run-script phpstan

  build:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          ## Accessing to Github secrets, where you can store your configuration
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: db-password
          MYSQL_DATABASE: event-repo-db-name
        ## map the "external" 33306 port with the "internal" 3306
        ports:
          - 33306:3306
        # Set health checks to wait until mysql database has started (it takes some seconds to start)
        # data dir in memory: the suite rebuilds and reseeds the database per test process
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl #optional
          coverage: none
          ini-values: "post_max_size=256M" #optional

      - name: Check PHP Version
        run: php -v

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --quiet --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # The dependency audits run in their own workflow (audit.yml), so a newly
      # published advisory doesn't stop the tests or block a deploy.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # the version production runs
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json pins (and fails if it is out of date)
      - name: Install NPM Dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint

      # the Vite build used to run for the first time on the production server
      - name: Build frontend assets
        run: npm run build

      - name: Clear Config
        run: php artisan config:clear

      - name: Generate Key
        run: php artisan key:generate

      - name: Create asset storage path
        run: mkdir -p ${{ github.workspace }}/public/storage/photos

      - name: Create symlink
        run: php artisan storage:link

      # Production runs with these three caches and nothing else did, so a
      # closure in a config file or a Blade file that doesn't compile first
      # failed during a deploy. Cleared again straight away: a cached config
      # would make the tests ignore phpunit.xml.
      - name: Build the production caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear

      - name: Run test suite
        env:
          APP_URL: http://localhost
          FACEBOOK_APP_ID: 7777777
          FACEBOOK_APP_SECRET: 6666666
          FACEBOOK_GRAPH_VERSION: v2.1
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: event-repo-db-name
          DB_PORT: 33306
          DB_USER: root
          DB_PASSWORD: db-password
        # RefreshDatabase builds and seeds each process's own test database
        # (event-repo-db-name_test_N), so there is no separate migrate/seed step.
        run: php artisan test --parallel --processes=4
