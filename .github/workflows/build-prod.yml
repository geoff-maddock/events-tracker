name: Build Prod
on:
  workflow_dispatch:

jobs:
  # Only deploy a commit whose CI ("PHP Composer") run on main passed (#2181).
  ci-check:
    name: Require green CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow php.yml --commit "$GITHUB_SHA" \
            --json conclusion --jq '.[0].conclusion')
          echo "CI for $GITHUB_SHA: ${conclusion:-no run found}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for $GITHUB_SHA; not deploying."
            exit 1
          fi

  build:
    name: Build Prod
    needs: ci-check
    runs-on: ubuntu-24.04
    steps:
      - name: executing remote ssh commands using password
        # pinned to v1.2.5 by commit, so a moved tag can't change what runs with prod credentials
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            # bin/deploy is the one list of deploy steps, shared with a deploy
            # run by hand on the server. Given a commit, it stops after the
            # pull unless main is at exactly the commit CI checked.
            cd /var/www/events-tracker
            bash bin/deploy "${{ github.sha }}"
